<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
  </defs>
  <!-- Network Connections -->
  <line x1="256" y1="256" x2="120" y2="120" stroke="#FF8E53" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="392" y2="120" stroke="#FF8E53" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="120" y2="392" stroke="#FF8E53" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="392" y2="392" stroke="#FF8E53" stroke-width="14" stroke-linecap="round"/>
  <!-- Pulse Rings -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-dasharray="10 10"/>
  <!-- Central Hub -->
  <circle cx="256" cy="256" r="48" fill="url(#apiGrad)"/>
  <!-- Endpoint Nodes -->
  <circle cx="120" cy="120" r="32" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="8"/>
  <circle cx="392" cy="120" r="32" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="8"/>
  <circle cx="120" cy="392" r="32" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="8"/>
  <circle cx="392" cy="392" r="32" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="8"/>
  <!-- Inner Dots -->
  <circle cx="120" cy="120" r="12" fill="#FF8E53"/>
  <circle cx="392" cy="120" r="12" fill="#FF8E53"/>
  <circle cx="120" cy="392" r="12" fill="#FF8E53"/>
  <circle cx="392" cy="392" r="12" fill="#FF8E53"/>
</svg>
